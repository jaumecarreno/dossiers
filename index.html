<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sitio de bienvenida para dossiers.bluetime.cloud"
    />
    <title>dossiers.bluetime.cloud &middot; Hola mundo</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1020;
        --panel: #121a2b;
        --text: #e5ecf4;
        --muted: #9fb0c3;
        --accent: #4fd1ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: radial-gradient(circle at top, #1a2848, var(--bg) 55%);
        color: var(--text);
      }

      main {
        width: min(720px, 100%);
        border: 1px solid #23304d;
        border-radius: 18px;
        background: color-mix(in srgb, var(--panel) 92%, black 8%);
        box-shadow: 0 20px 60px rgb(0 0 0 / 30%);
        padding: clamp(1.5rem, 4vw, 3rem);
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 8vw, 3.5rem);
        letter-spacing: 0.02em;
      }

      p {
        margin: 1rem 0 0;
        font-size: clamp(1rem, 2vw, 1.15rem);
        color: var(--muted);
      }

      .accent {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hola, mundo <span class="accent">&#128075;</span></h1>
      <p>Bienvenido a <strong>dossiers.bluetime.cloud</strong>.</p>
    </main>
  </body>
</html>
