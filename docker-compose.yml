services:
  web:
    build: .
    command: sh -c "alembic upgrade head && gunicorn 'app:create_app()' --bind 0.0.0.0:$${PORT:-3000} --timeout $${GUNICORN_TIMEOUT:-7200} --graceful-timeout $${GUNICORN_GRACEFUL_TIMEOUT:-120}"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://dossiers:dossiers@postgres:5432/dossiers
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /storage
      PORT: 3000
      GUNICORN_TIMEOUT: 7200
      GUNICORN_GRACEFUL_TIMEOUT: 120
    ports:
      - "3000:3000"
    volumes:
      - storage:/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: sh -c "alembic upgrade head && rq worker default --url \"$${REDIS_URL}\""
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://dossiers:dossiers@postgres:5432/dossiers
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /storage
    volumes:
      - storage:/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dossiers
      POSTGRES_USER: dossiers
      POSTGRES_PASSWORD: dossiers
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dossiers -d dossiers"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  storage:
